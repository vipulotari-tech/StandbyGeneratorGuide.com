name: Validate Astro Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: JavaScript lint
        run: npm run lint
      - name: Deployment and security-policy tests
        run: npm run test:deployment
      - name: Astro checks
        run: npm run check
      - name: TypeScript checks
        run: npm run typecheck
      - name: Planning math and evidence
        run: npm run test:planning && npm run test:research && npm run validate:evidence
      - name: Build staging
        run: npm run build:staging
      - name: Unique generated HTML IDs
        run: node tools/qa-unique-ids.mjs
      - name: Vendored image integrity and payload budgets
        run: npm run qa:assets
      - name: Staging indexing assertions
        run: node tools/qa-indexing.mjs staging
      - name: Security headers and published artifact scan
        run: npm run qa:security
      - name: Editorial disclosure and staging coverage
        run: python tools/qa-coverage.py
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Start staging preview
        run: |
          npx wrangler dev --config wrangler.staging.jsonc --ip 127.0.0.1 --port 8321 > /tmp/hgg-wrangler.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hgg-wrangler.log
          exit 1
      - name: Staging HTTP headers, redirects, errors and indexing
        env:
          BASE_URL: http://127.0.0.1:8321
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run qa:http:staging
      - name: Browser QA
        env:
          BASE_URL: http://127.0.0.1:8321
        run: npm run qa:browser
      - name: Every-route viewport and component matrix
        run: node tools/qa-matrix.mjs
      - name: Filled maintenance download and browser-print PDF regression
        run: node tools/qa-pdf.mjs
      - name: Interactive and responsive QA
        env:
          BASE_URL: http://127.0.0.1:8321
        run: npm run qa:planners
      - name: All-route WCAG automated accessibility checks
        env:
          BASE_URL: http://127.0.0.1:8321
        run: npm run qa:accessibility
      - name: Local laboratory performance and layout stability
        env:
          BASE_URL: http://127.0.0.1:8321
        run: npm run qa:performance
      - name: Guided workflow and research QA
        env:
          BASE_URL: http://127.0.0.1:8321
        run: node tools/qa-guided.mjs
      - name: Full functional audit
        env:
          BASE_URL: http://127.0.0.1:8321
        run: node tools/qa-functional.mjs
      - name: Build production
        run: npm run build:production
      - name: Production security assertions
        run: npm run qa:security
      - name: Production indexing assertions
        run: node tools/qa-indexing.mjs production
      - name: AdSense disclosure readiness
        run: node tools/qa-adsense-readiness.mjs
      - name: Full production HTML audit
        run: npm run qa:seo
      - name: Editorial disclosures, schema and production coverage
        run: python tools/qa-brand.py && python tools/qa-schema.py && python tools/qa-coverage.py
      - name: Ahrefs topic-cluster and internal-link QA
        run: npm run qa:keywords
      - name: Homeowner decision, professional review and pilot QA
        run: npm run qa:buyer-journey
      - name: Production SEO assertions
        run: |
          test -f dist/robots.txt
          grep -q "Allow: /" dist/robots.txt
          grep -q "https://standbygeneratorguide.com/sitemap-index.xml" dist/robots.txt
          test -f dist/sitemap-index.xml
          ! grep -R -q "standbygeneratorguide.com/404/" dist/sitemap*.xml
          node tools/qa-indexing.mjs production

      - name: Start production preview
        run: |
          npx wrangler dev --config wrangler.production.jsonc --ip 127.0.0.1 --port 8322 > /tmp/hgg-production.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8322/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hgg-production.log
          exit 1
      - name: Production HTTP and browser validation
        env:
          BASE_URL: http://127.0.0.1:8322
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run qa:http:production && npm run qa:browser
      - name: Validate staging, production and www deployment configuration
        run: |
          npx wrangler deploy --config wrangler.jsonc --dry-run
          npx wrangler deploy --config wrangler.staging.jsonc --dry-run
          npx wrangler deploy --config wrangler.production.jsonc --env="" --dry-run
          npx wrangler deploy --config wrangler.www.jsonc --env="" --dry-run

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeowner-platform-qa
          path: .qa/
          include-hidden-files: true
